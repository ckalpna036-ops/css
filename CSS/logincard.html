<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .login-card h2 {
            text-align: center;
        }

        .login-card form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .login-card input,
        .login-card button {
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Enter Username">
            <input type="password" placeholder="Enter Password">
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
