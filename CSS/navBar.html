<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: rgb(0, 0, 0);
            padding: 15px 30px;
        }

        ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        a {
            color: rgb(255, 20, 103);
            text-decoration: none;
            font-size: 28px;
        }

        a:hover {
            color: orange;
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
