<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>

    <style>

        /* 1. Universal Selector */
        * {
            font-family: Arial, sans-serif;
        }

        /* 2. Element Selector */
        p {
            color: blue;
        }

        /* 3. Class Selector */
        .special {
            background-color: yellow;
        }

        /* 4. ID Selector */
        #one{
            color: red;
            text-align: center;
        }

        /* 5. Attribute Selector */
       li[for="label"]

    </style>
</head>

<body>

    <!-- ID Selector -->
    <h1 id="main-heading">CSS Selectors</h1>

    <!-- Element Selector -->
    <p>This paragraph is selected using an element selector.</p>

    <!-- Class Selector -->
    <p class="special">
        This paragraph is selected using a class selector.
    </p>

    <!-- Attribute Selector -->
   <li>
    hii </li>
    <li> hello </li>
    <li> whats app </li>
     
</body>
</html>
