<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Effect</title>

    <style>

        body {
            margin: 0;

            background-image: url('https://picsum.photos/1920/1080');
            background-size: cover;
            background-position: center;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass {
            width: 350px;
            padding: 30px;

            background: rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            backdrop-filter: blur(10px);

            text-align: center;
        }

        .glass img {
            width: 200px;
            height: 200px;

            border-radius: 50%;
        }

        .glass h1 {
            color: white;
        }

        .glass p {
            color: white;
        }

    </style>

</head>

<body>

    <div class="glass">

        <img src="https://picsum.photos/300/300">

        <h1>Glass Effect</h1>

        <p>
            This is a glassmorphism container
            over a background image.
        </p>

    </div>

</body>

</html>
