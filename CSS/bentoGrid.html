<!DOCTYPE html>
<html>
<head>
    <title>Bento Grid</title>

    <style>
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
        .container {
            display: grid;
            height: 500px;
            width: 500px;
            grid-template-areas:"box1 box2 box2"
                                "box3 box2 box2"
                                "box4 box5 box6";
                                gap: 10px;
            outline:1px dashed rgb(159, 125, 125);
           
        }

          
        .container > div {
            /* outline: 4px solid rgb(36, 37, 39); */
             box-shadow: 0px 0px 10px rgba(9, 2, 2, 0.5);
           
        }
    </style>
</head>

<body>

    <div class="container">

        <div style="grid-area: box1;">1</div>
        <div style="grid-area: box2;">2</div>
        <div style="grid-area: box3;">3</div>
        <div style="grid-area: box4;">4</div>
        <div style="grid-area: box5;">5</div>
        <div style="grid-area: box6;">6</div>
      
    </div>

</body>
</html>
