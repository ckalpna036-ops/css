<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
           
            flex-direction:row;
            align-items: center;
            height: 90vw;
            width: 90vh;
            
            
        }
        .container > div {
            color: white;
            font-size: 30px;
            text-align: center;
            padding: 20px;
        }

        #box1{
          
            background-color: rgb(173, 216, 230);
            flex-basis: 100px;
            flex-grow: 1;
        }

        #box2{
          
            background-color: rgb(48, 115, 37);
            flex-basis: 100px;
            flex-grow: 3;
        }
        #box3{
           
            background-color: rgb(0, 93, 124);
            flex-basis: 100px;
            flex-grow: 1;
        }
        #box4{
           
            background-color: rgb(16, 154, 71);
            flex-basis: 100px;
            flex-grow: 1;
        }
    </style>

</head>
<body>
    <div class="container">
        <div id="box">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
    </div>
</body>
</html>
