<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Subgrid</title>

    <style>
        .container {
            display: grid;
            height:500px;
            width:500px;


            grid-template-columns:1fr 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap:calc(var(--size)/2);

            outline: 1px solid black;
            color:white;
            border-radius:20%;
        }

        .container > div {
            outline: 2px dashed rgb(37, 115, 240);
            background-color: rgb(37, 115, 240);
        }

        #parent {
            display: grid;

            grid-template-columns: subgrid;
            grid-template-rows: subgrid;

            grid-column: 1 / 3;
            grid-row: 1 / 3;

            background-color: var(--primary-color);
            border-radius:30% 0 0 0;
;
        }

        #child {
            background-color:var(--secondary-color);

            grid-column: 1 / 2;
        }

      
    </style>
</head>

<body>

    <div class="container">

        <div id="parent">
            <div id="child">
                <p>1</p>
            </div>


       
 
</body>
</html>
