<!DOCTYPE html>
<html>
<head>
    <title>Bento Layout</title>
</head>

<body style="margin:20px; background-color:#f2f2f2;">

    <h1 style="color:rgb(53,93,126);">Bento Layout</h1>
    <p style="color:rgb(123,12,151);">A bento layout is a grid-based design that organizes content into distinct sections.</p>

<div style="display:flex;">


    <!-- Left Side -->
    <div style="width:50%;">

        <!-- Major Box -->
        <div style="background-color:lightblue; height:320px; margin:10px; border-radius:15px; text-align:center;">
            <h2 style="padding-top:140px;">Major Box</h2>
        </div>

        <!-- Medium Box -->
        <div style="background-color:lightgreen; height:150px; margin:10px; border-radius:15px; text-align:center;">
            <h2 style="padding-top:55px;">Medium Box</h2>
        </div>

    </div>

    <!-- Right Side -->
    <div style="width:50%;">

        <!-- Two Small Boxes -->
        <div style="display:flex;">

            <div style="background-color:lightcoral; width:50%; height:150px; margin:10px; border-radius:15px; text-align:center;">
                <h2 style="padding-top:55px;">Small 1</h2>
            </div>

            <div style="background-color:lightsalmon; width:50%; height:150px; margin:10px; border-radius:15px; text-align:center;">
                <h2 style="padding-top:55px;">Small 2</h2>
            </div>

        </div>

        <!-- Large Box -->
        <div style="background-color:khaki; height:320px; margin:10px; border-radius:15px; text-align:center;">
            <h2 style="padding-top:140px;">Large Box</h2>
        </div>

    </div>

</div>

</body>
</html>
