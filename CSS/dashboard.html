<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>

<body style="margin:0; background-color:#f2f2f2;">

<div style="display:flex;">

    <!-- Sidebar -->
    <div style="background-color:rgb(53,93,126); width:220px; height:100vh; color:white;">

        <h2 style="text-align:center;">MENU</h2>

        <ul style="list-style:none;">
            <li style="margin:25px;">🏠 Home</li>
            <li style="margin:25px;">👤 Users</li>
            <li style="margin:25px;">🛒 Products</li>
            <li style="margin:25px;">📦 Orders</li>
            <li style="margin:25px;">⚙ Settings</li>
        </ul>

    </div>

    <!-- Main Content -->
    <div style="margin:30px; width:100%;">

        <h1 style="color:rgb(53,93,126);">Dashboard</h1>

        <!-- Cards -->
        <div style="display:flex; justify-content:space-around; margin-top:40px;">

            <div style="background-color:white; width:180px; border-radius:10px; text-align:center; padding:20px;">
                <h2 style="color:rgb(82, 82, 119);">120</h2>
                <p>Total Users</p>
            </div>

            <div style="background-color:white; width:180px; border-radius:10px; text-align:center; padding:20px;">
                <h2 style="color:rgba(0, 128, 0, 0.196);">75</h2>
                <p>Products</p>
            </div>

            <div style="background-color:white; width:180px; border-radius:10px; text-align:center; padding:20px;">
                <h2 style="color:rgb(228, 157, 23);">42</h2>
                <p>Orders</p>
            </div>

            <div style="background-color:white; width:180px; border-radius:10px; text-align:center; padding:20px;">
                <h2 style="color:rgb(226, 72, 72);">₹50,000</h2>
                <p>Revenue</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
