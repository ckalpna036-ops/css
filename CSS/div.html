<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        #div2 {
            width: 100%;
        }

        #img1 {
            float: left;
            width: 200px;
            height: 200px;
            margin-right: 15px;
        }

        #img2 {
            float: right;
            width: 200px;
            height: 200px;
            margin-left: 15px;
        }

        p {
            text-align: justify;
        }

    </style>
</head>

<body>

    <div id="div2">

        <!-- Left Image -->
        <img id="img1" src="https://picsum.photos/1920/1070" alt="image">

        <!-- Right Image -->
        <img id="img2" src="https://picsum.photos/1920/1680" alt="image">

        <!-- Text between images -->
        <p>
            The div tag defines a division or a section in an HTML document.

            The div tag is used as a container for HTML elements which can
            then be styled with CSS or manipulated with JavaScript.

            The div tag is easily styled by using the class or id attribute.

            Any sort of content can be put inside the div tag!
        </p>

    </div>

</body>
</html>
