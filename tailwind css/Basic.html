<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Tailwind</title>
</head>

<body>

    <div class="w-[600px] flex">

        <!-- Linear Gradient -->
        <div class="h-[300px] w-1/3 bg-gradient-to-r from-pink-500 to-black rounded-full border-solid border-4 border-black">
        </div>

        <!-- Conic Gradient -->
        <div class="h-[300px] w-1/3 bg-[conic-gradient(cyan,purple,yellow,pink)]  rounded-full border-solid border-4 border-black">
        </div>

        <!-- Radial Gradient -->
        <div class="h-[300px] w-1/3 bg-[radial-gradient(circle,blue,purple)]  rounded-full border-double border-4 border-black">
        </div>

    </div>


    <div class="flex">

        <!-- Normal Yellow Box -->
        <div class="h-[300px] w-1/3 bg-yellow-500">
            <p class="text-black text-center">Hello, Tailwind!</p>
        </div>

        <!-- Normal Pink Box -->
        <div class="h-[300px] w-1/3 bg-pink-500">
        </div>

    </div>


    <h1 class="text-black text-3xl font-bold bg-green-500 rounded-lg w-64 h-20 border-2">
        Hello Tailwind
    </h1>

</body>
</html>
